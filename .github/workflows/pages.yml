# Publishes the website to GitHub Pages at https://<user>.github.io/<repo>/ on every push to main.
# With the repository variable NEXUS_API_URL set (Settings → Secrets and variables → Actions → Variables, e.g.
# https://nexus-xxxx.onrender.com) the site talks to that hosted NEXUS server (Gemini, voice). Without it, it is the
# offline web demo (the scripted demo brain, labelled "not an AI").
name: Web demo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx vite build
        env:
          VITE_WEB_DEMO: ${{ vars.NEXUS_API_URL == '' && '1' || '0' }}
          VITE_API_BASE: ${{ vars.NEXUS_API_URL }}
          NEXUS_BASE: /${{ github.event.repository.name }}/
          NEXUS_META_CSP: '1'
      # single-page app: unknown paths (/nexus/app, /nexus/about…) fall back to the app shell
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
