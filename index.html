<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS — intelligence, with a presence</title>
    <meta name="description" content="MISSION NEXUS — an interactive AI robotics experience that brings conversation, expression and motion together in one curious digital companion." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07111F" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>try{var t=localStorage.getItem('nexus-theme');if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';var d=document.documentElement;d.dataset.theme=t==='light'?'light':'dark';if(!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('booting');var c=localStorage.getItem('nexus-palette-css');if(c&&/^:root\[data-palette="custom"\]\{[-\w:; ./()]+\}$/.test(c)){var st=document.createElement('style');st.id='nexus-palette';st.textContent=c;document.head.appendChild(st);d.dataset.palette='custom'}}catch(e){}</script>
    <style>
      /* NEXUS power-on: wordmark, a scanning line and an honest indeterminate indicator while the page loads.
         Removed as soon as the page is ready (src/boot.ts); a CSS fallback hides it after 6 s even without JavaScript. */
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;align-content:center;gap:18px;background:radial-gradient(ellipse 46% 38% at 50% 46%,rgb(var(--k-38d9ff, 56 217 255) / .10),transparent 70%),radial-gradient(ellipse 80% 70% at 50% 40%,rgb(var(--k-0b1a30, 11 26 48)),rgb(var(--k-07111f, 7 17 31)) 55%,rgb(var(--k-05080d, 5 8 13)) 100%);color:rgb(var(--k-f4f8ff, 244 248 255));font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.32em;pointer-events:none;transition:opacity .4s cubic-bezier(.2,.7,.2,1),visibility .4s;animation:boot-out .4s ease 6s forwards;overflow:hidden}
      :root[data-theme=light] #boot{background:radial-gradient(ellipse 46% 38% at 50% 46%,rgb(var(--k-1268f5, 18 104 245) / .10),transparent 70%),rgb(var(--k-f4f8ff, 244 248 255));color:rgb(var(--k-07111f, 7 17 31))}
      #boot .mark{width:68px;height:68px;filter:drop-shadow(0 0 22px rgb(var(--k-38d9ff, 56 217 255) / .35));animation:boot-in .5s cubic-bezier(.2,.7,.2,1) both}
      #boot .eye{transform-origin:center;transform-box:fill-box;animation:boot-eye .7s cubic-bezier(.3,1.4,.5,1) .15s both}
      #boot .word{font:300 22px/1 'Inter Variable',Inter,system-ui,sans-serif;letter-spacing:.5em;margin-right:-.5em;animation:boot-in .5s cubic-bezier(.2,.7,.2,1) .08s both}
      #boot .status{opacity:.62;font-size:10.5px;animation:boot-in .5s ease .2s both}
      #boot .bar{position:relative;width:148px;height:2px;border-radius:2px;background:rgb(var(--k-778394, 119 131 148) / .25);overflow:hidden}
      #boot .bar::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgb(var(--k-38d9ff, 56 217 255)),transparent);animation:boot-bar 1.1s cubic-bezier(.4,0,.2,1) infinite}
      #boot .scan{position:absolute;left:0;right:0;top:-10%;height:1px;background:linear-gradient(90deg,transparent,rgb(var(--k-38d9ff, 56 217 255) / .55),transparent);box-shadow:0 0 18px rgb(var(--k-38d9ff, 56 217 255) / .5);animation:boot-scan 1.4s cubic-bezier(.4,0,.2,1) .1s both}
      #boot::before{content:"";position:absolute;inset:-10%;opacity:.55;background-image:radial-gradient(1px 1px at 12% 18%,rgb(var(--k-dff1ff, 223 241 255)) 99%,transparent),radial-gradient(1px 1px at 28% 72%,rgb(var(--k-a9c8ff, 169 200 255)) 99%,transparent),radial-gradient(1.5px 1.5px at 44% 34%,rgb(var(--k-dff1ff, 223 241 255)) 99%,transparent),radial-gradient(1px 1px at 63% 12%,rgb(var(--k-a9c8ff, 169 200 255)) 99%,transparent),radial-gradient(1px 1px at 78% 64%,rgb(var(--k-dff1ff, 223 241 255)) 99%,transparent),radial-gradient(1.5px 1.5px at 88% 28%,rgb(var(--k-a9c8ff, 169 200 255)) 99%,transparent),radial-gradient(1px 1px at 8% 84%,rgb(var(--k-dff1ff, 223 241 255)) 99%,transparent),radial-gradient(1px 1px at 54% 88%,rgb(var(--k-a9c8ff, 169 200 255)) 99%,transparent),radial-gradient(1px 1px at 92% 86%,rgb(var(--k-dff1ff, 223 241 255)) 99%,transparent),radial-gradient(1px 1px at 36% 8%,rgb(var(--k-dff1ff, 223 241 255)) 99%,transparent);animation:boot-drift 6s linear both}
      :root[data-theme=light] #boot::before{opacity:.35;filter:invert(.6)}
      #boot .orbit{position:absolute;width:132px;height:132px;left:50%;top:50%;margin:-66px 0 0 -66px;transform:translateY(-34px) rotateX(64deg);border-radius:50%;border:1px solid rgb(var(--k-38d9ff, 56 217 255) / .28);animation:boot-spin 2.4s linear infinite}
      #boot .orbit::after{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgb(var(--k-38d9ff, 56 217 255));box-shadow:0 0 10px rgb(var(--k-38d9ff, 56 217 255))}
      @keyframes boot-spin{to{transform:translateY(-34px) rotateX(64deg) rotateZ(360deg)}}
      @keyframes boot-drift{to{transform:translate3d(-2%,1%,0)}}
      #boot.done{opacity:0;visibility:hidden}
      @keyframes boot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes boot-eye{from{transform:scaleY(.05);opacity:.2}60%{transform:scaleY(1.1);opacity:1}to{transform:scaleY(1)}}
      @keyframes boot-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @keyframes boot-scan{from{top:-5%}to{top:105%}}
      @keyframes boot-out{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#boot{transition:none;animation:boot-out 0s 6s forwards}#boot *,#boot .bar::after,#boot::before,#boot .orbit{animation:none!important}#boot .scan{display:none}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <span class="scan"></span>
      <span class="orbit"></span>
      <svg class="mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b1a30"/><rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#38D9FF" stroke-opacity=".3" stroke-width="1.5"/><line x1="32" y1="17" x2="32" y2="10" stroke="#2E3846" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="9" r="3.6" fill="#38D9FF"/><rect x="12" y="17" width="40" height="35" rx="12" fill="#2a3446" stroke="#04060a" stroke-width="1.5"/><rect x="17" y="23" width="30" height="23" rx="8" fill="#0d1118" stroke="#3B8BFF" stroke-width="1.6"/><path class="eye" d="M22 34.5a4.5 4.5 0 0 1 9 0z"  fill="#38D9FF"/><path class="eye" d="M33 34.5a4.5 4.5 0 0 1 9 0z" fill="#38D9FF"/><path d="M28 39q4 4 8 0" fill="none" stroke="#38D9FF" stroke-width="2" stroke-linecap="round"/></svg>
      <div class="word">NEXUS</div>
      <div class="bar"></div>
      <div class="status">INITIALIZING NEXUS</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
